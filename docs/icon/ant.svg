<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Ant">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d2914"/>
      <stop offset="100%" stop-color="#1a1208"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5e34"/>
      <stop offset="100%" stop-color="#5c3d1e"/>
    </linearGradient>
  </defs>
  <!-- antennae -->
  <path d="M44 28 Q32 8 22 14" fill="none" stroke="#2d1f0f" stroke-width="4" stroke-linecap="round"/>
  <path d="M84 28 Q96 8 106 14" fill="none" stroke="#2d1f0f" stroke-width="4" stroke-linecap="round"/>
  <circle cx="22" cy="14" r="5" fill="#2d1f0f"/>
  <circle cx="106" cy="14" r="5" fill="#2d1f0f"/>
  <!-- head -->
  <ellipse cx="64" cy="38" rx="26" ry="22" fill="url(#shine)"/>
  <!-- eyes -->
  <circle cx="54" cy="36" r="5" fill="#fff"/>
  <circle cx="74" cy="36" r="5" fill="#fff"/>
  <circle cx="55" cy="37" r="2.5" fill="#1a1208"/>
  <circle cx="75" cy="37" r="2.5" fill="#1a1208"/>
  <!-- thorax -->
  <ellipse cx="64" cy="68" rx="22" ry="18" fill="url(#body)"/>
  <!-- abdomen -->
  <ellipse cx="64" cy="98" rx="30" ry="22" fill="url(#body)"/>
  <ellipse cx="64" cy="94" rx="18" ry="8" fill="#6b4423" opacity="0.35"/>
  <!-- legs -->
  <g stroke="#2d1f0f" stroke-width="4" stroke-linecap="round">
    <path d="M42 62 L18 78 M42 68 L14 92 M42 74 L20 108"/>
    <path d="M86 62 L110 78 M86 68 L114 92 M86 74 L108 108"/>
    <path d="M52 82 L36 100 M76 82 L92 100"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Nest">
  <defs>
    <radialGradient id="hole" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#5c3d1e"/>
      <stop offset="100%" stop-color="#2d1f0f"/>
    </radialGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#8b5e34"/>
    </linearGradient>
    <linearGradient id="twig" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a67c52"/>
      <stop offset="100%" stop-color="#6b4423"/>
    </linearGradient>
  </defs>
  <!-- outer nest bowl -->
  <ellipse cx="64" cy="72" rx="48" ry="34" fill="url(#rim)" stroke="#5c3d1e" stroke-width="3"/>
  <!-- twigs -->
  <path d="M22 68 Q40 48 64 44 Q88 48 106 68" fill="none" stroke="url(#twig)" stroke-width="5" stroke-linecap="round"/>
  <path d="M28 82 Q48 58 64 54 Q80 58 100 82" fill="none" stroke="#6b4423" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <path d="M18 78 Q36 88 64 90 Q92 88 110 78" fill="none" stroke="#8b5e34" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <!-- entrance -->
  <ellipse cx="64" cy="76" rx="26" ry="20" fill="url(#hole)"/>
  <ellipse cx="64" cy="70" rx="14" ry="6" fill="#3d2914" opacity="0.35"/>
</svg>

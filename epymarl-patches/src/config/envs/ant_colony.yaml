env: "gymma"

env_args:
  key: "antcolony:AntColony-v0"
  time_limit: 800
  pretrained_wrapper: null
  n_ants: 32
  grid_width: 32
  grid_height: 32
  max_steps: 800
  n_food: 24
  wall_fraction: 0.10
  obs_dim: 30

# Cooperative global reward (required for QMIX / VDN).
common_reward: True
reward_scalarisation: "sum"

test_greedy: True
test_nepisode: 16
test_interval: 500000
log_interval: 50000
runner_log_interval: 50000
learner_log_interval: 50000

# Training budget (env steps), from 16×16 W&B run rich-armadillo-3:
#   ~80–90% success around 4–5M t_env; 32×32 baseline ≈ 5M × 4 = 20M.
#   t_max 40M = 2× that headroom (old run was still climbing at 20M on unscaled rewards).
t_max: 40000000

save_model: True
save_model_interval: 1000000  # every 1M t_env (was 5M — missed 77% peak between 20M and 25M)
save_model_on_best_test: True
save_model_best_metric: "test_battle_won_mean"
save_replay: False
use_tensorboard: False

# Weights & Biases (`wandb login` once; optional: with wandb_team=... wandb_mode=online)
use_wandb: True
wandb_team: null
wandb_project: "ant-colony-foraging"
wandb_mode: "offline"
wandb_save_model: False
